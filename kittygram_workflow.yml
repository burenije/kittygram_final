name: Kittygram CI/CD

'on':
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: kittygram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: django-insecure-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.11.13
      - name: Check Python code
        run: ruff check .
      - name: Run Django tests
        run: python manage.py test

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: 'true'

  publish:
    name: Publish kittygram_${{ matrix.component }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
          - component: gateway
            context: ./nginx
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_${{ matrix.component }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_${{ matrix.component }}:${{ github.sha }}

  deploy:
    name: Deploy Kittygram
    if: vars.DEPLOY_KITTYGRAM == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update containers on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/kittygram
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          target="$SSH_USER@$SSH_HOST"
          ssh_options=(-i ~/.ssh/kittygram -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_options[@]}" "$target" 'mkdir -p ~/kittygram'
          scp "${ssh_options[@]}" docker-compose.production.yml "$target:kittygram/"
          ssh "${ssh_options[@]}" "$target" "cd ~/kittygram &&
            export KITTYGRAM_IMAGE_TAG='$GITHUB_SHA' &&
            docker compose -f docker-compose.production.yml pull &&
            docker compose -f docker-compose.production.yml up -d --wait --wait-timeout 180"

  notify:
    name: Notify in Telegram
    if: |
      always() && needs.publish.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -eu
          message='Kittygram: тесты прошли, образы опубликованы в Docker Hub.'
          if [ "$DEPLOY_RESULT" = success ]; then
            message="$message Деплой завершён."
          fi
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$message Автор пуша: $GITHUB_ACTOR. $commit_url" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
