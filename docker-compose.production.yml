services:
  db:
    image: postgres:13
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: "${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/kittygram_backend:${KITTYGRAM_IMAGE_TAG:-latest}"
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    image: "${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/kittygram_frontend:${KITTYGRAM_IMAGE_TAG:-latest}"
    command: ["cp", "-r", "/app/build/.", "/static/"]
    volumes:
      - static:/static

  gateway:
    image: "${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/kittygram_gateway:${KITTYGRAM_IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KITTYGRAM_PORT:-9000}:80"
    volumes:
      - static:/static:ro
      - media:/media:ro

volumes:
  pg_data:
  static:
  media:
