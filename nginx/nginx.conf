server {
  listen 80;
  server_tokens off;
  client_max_body_size 10M;
  absolute_redirect off;

  root /static;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  location = /api {
    return 308 /api/;
  }

  location = /admin {
    return 308 /admin/;
  }

  location /api/ {
    proxy_pass $backend;
  }

  location /admin/ {
    proxy_pass $backend;
  }

  location /static/ {
    try_files $uri =404;
  }

  location /media/ {
    alias /media/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
